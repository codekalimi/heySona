<!doctype html>
<!--
  heySona visual explainer.
  Hosted in a WKWebView by VisualExplainerPanelManager.swift (shipped in VisualExplainer.bundle). Renders a scene
  description (shapes, labels, arrows, particle flows, camera moves) as an
  animated, narrated, step-by-step explanation. Scene format and the
  JavaScript API are documented at the top of visual-explainer.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heySona Explainer</title>
  <style>
    :root {
      --background: #101211;
      --surface: #171918;
      --border: #373b39;
      --text-primary: #eceeed;
      --text-secondary: #adb5b2;
      --text-tertiary: #6b736f;
      --accent: #3380ff;
      --accent-soft: rgba(51, 128, 255, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--background);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #explainer {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ---- Header ---- */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid rgba(55, 59, 57, 0.6);
    }

    #scene-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #step-counter {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    /* ---- Stage: the 3D/2D canvas with labels on top ---- */
    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(51, 128, 255, 0.10), transparent 60%),
        radial-gradient(ellipse at 50% 120%, rgba(42, 63, 168, 0.18), transparent 55%),
        var(--background);
      cursor: grab;
    }

    #stage:active { cursor: grabbing; }

    #stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #label-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .scene-label {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.35s ease;
      white-space: nowrap;
    }

    .scene-label.is-visible { opacity: 1; }

    .scene-label-text {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(23, 25, 24, 0.86);
      border: 1px solid rgba(51, 128, 255, 0.65);
      padding: 4px 9px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .scene-label-leader {
      width: 1.5px;
      height: 18px;
      background: linear-gradient(rgba(51, 128, 255, 0.9), rgba(51, 128, 255, 0.2));
    }

    .scene-label-anchor {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      transform: translateY(3px);
    }

    #loading-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    /* ---- Caption: the current step's narration ---- */
    #caption {
      min-height: 76px;
      padding: 14px 20px 6px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-primary);
      transition: opacity 0.3s ease;
    }

    #caption.is-changing { opacity: 0; }

    /* ---- Controls ---- */
    #controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px 14px;
    }

    .control-button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .control-button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .control-button.is-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .control-button.is-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }

    .control-button:disabled {
      opacity: 0.35;
      cursor: default;
      background: transparent;
    }

    #step-dots {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: none;
      padding: 0;
      background: var(--border);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .step-dot:hover { background: var(--text-tertiary); }
    .step-dot.is-done { background: rgba(51, 128, 255, 0.45); }
    .step-dot.is-current { background: var(--accent); transform: scale(1.35); }
  </style>
</head>
<body>
  <div id="explainer">
    <div id="header">
      <div id="scene-title">heySona</div>
      <div id="step-counter"></div>
    </div>

    <div id="stage">
      <div id="label-layer"></div>
      <div id="loading-message">Preparing the explanation…</div>
    </div>

    <div id="caption"></div>

    <div id="controls">
      <button class="control-button" id="restart-button" title="Start over">↺</button>
      <button class="control-button" id="previous-button" title="Previous step">◀</button>
      <button class="control-button is-primary" id="play-pause-button" title="Play or pause">❚❚</button>
      <button class="control-button" id="next-button" title="Next step">▶</button>
      <div id="step-dots"></div>
      <button class="control-button" id="close-button" title="Close (Esc)">✕</button>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="visual-explainer.js"></script>
</body>
</html>
