<!doctype html>
<!--
  heySona visual explainer.
  Hosted in a WKWebView by VisualExplainerPanelManager.swift (shipped in VisualExplainer.bundle). Renders a scene
  description (shapes, labels, arrows, particle flows, camera moves) as an
  animated, narrated, step-by-step explanation. Scene format and the
  JavaScript API are documented at the top of visual-explainer.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heySona Explainer</title>
  <!-- KaTeX 0.18.11 (MIT) typesets equations; fonts load from katex/fonts. -->
  <link rel="stylesheet" href="katex/katex.min.css">
  <style>
    :root {
      --background: #101211;
      --surface: #171918;
      --border: #373b39;
      --text-primary: #eceeed;
      --text-secondary: #adb5b2;
      --text-tertiary: #6b736f;
      --accent: #3380ff;
      --accent-soft: rgba(51, 128, 255, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--background);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #explainer {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ---- Header ---- */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid rgba(55, 59, 57, 0.6);
    }

    #scene-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #step-counter {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    .header-button {
      height: 26px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .header-button:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
    #quiz-button { border-color: var(--accent); color: #ffffff; background: var(--accent-soft); }

    /* ---- Quiz and library panels, floating over the stage ---- */
    .stage-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, calc(100% - 40px));
      max-height: calc(100% - 40px);
      overflow-y: auto;
      padding: 16px 18px;
      border-radius: 14px;
      background: rgba(23, 25, 24, 0.97);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      cursor: default;
      z-index: 5;
    }
    .stage-panel[hidden] { display: none; }
    .stage-panel-header { display: flex; align-items: center; margin-bottom: 12px; }
    .stage-panel-title { flex: 1; font-size: 14px; font-weight: 650; }
    .panel-close-button {
      width: 26px; height: 26px; border-radius: 50%;
      border: none; background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary); cursor: pointer;
    }
    .panel-close-button:hover { background: rgba(255, 255, 255, 0.14); color: var(--text-primary); }

    .quiz-progress { font-size: 11px; color: var(--text-tertiary); margin-bottom: 6px; }
    .quiz-question { font-size: 15px; line-height: 1.4; margin-bottom: 12px; }
    .quiz-choice {
      display: block; width: 100%; text-align: left;
      margin-bottom: 8px; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary); font-size: 13px; cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .quiz-choice:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); }
    .quiz-choice:disabled { cursor: default; }
    .quiz-choice.is-correct { border-color: #4cd6a0; background: rgba(76, 214, 160, 0.14); }
    .quiz-choice.is-wrong { border-color: #ff6b8b; background: rgba(255, 107, 139, 0.12); }
    .quiz-feedback { font-size: 13px; line-height: 1.45; color: var(--text-secondary); margin: 6px 0 12px; }
    .panel-primary-button {
      height: 32px; padding: 0 16px; border-radius: 999px; border: none;
      background: var(--accent); color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .panel-primary-button:hover { background: #1d4ed8; }

    .library-entry {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 4px; border-bottom: 1px solid rgba(55, 59, 57, 0.6);
    }
    .library-entry:last-child { border-bottom: none; }
    .library-entry-text { flex: 1; min-width: 0; }
    .library-entry-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .library-entry-detail { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .library-entry-button {
      height: 26px; padding: 0 11px; border-radius: 999px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .library-entry-button:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
    .library-entry-button.is-play { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .library-empty { font-size: 13px; color: var(--text-tertiary); line-height: 1.5; padding: 8px 0; }

    /* ---- Stage: the 3D/2D canvas with labels on top ---- */
    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(51, 128, 255, 0.10), transparent 60%),
        radial-gradient(ellipse at 50% 120%, rgba(42, 63, 168, 0.18), transparent 55%),
        var(--background);
      cursor: grab;
    }

    #stage:active { cursor: grabbing; }

    #stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #label-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .scene-label {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.35s ease;
      white-space: nowrap;
    }

    .scene-label.is-visible { opacity: 1; }

    .scene-label-text {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(23, 25, 24, 0.86);
      border: 1px solid rgba(51, 128, 255, 0.65);
      padding: 4px 9px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .scene-label-leader {
      width: 1.5px;
      height: 18px;
      background: linear-gradient(rgba(51, 128, 255, 0.9), rgba(51, 128, 255, 0.2));
    }

    .scene-label-anchor {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      transform: translateY(3px);
    }

    .scene-card {
      --card-accent: #3380ff;
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(23, 25, 24, 0.92);
      border: 1px solid rgba(55, 59, 57, 0.9);
      border-left: 3px solid var(--card-accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .scene-card.is-highlighted {
      border-color: var(--card-accent);
      box-shadow: 0 0 0 1px var(--card-accent), 0 8px 28px rgba(51, 128, 255, 0.35);
    }

    .scene-card-title {
      font-size: 13px;
      font-weight: 650;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .scene-card-math { color: #ffffff; font-size: 15px; margin: 4px 0 2px; overflow-x: auto; overflow-y: hidden; }
    .scene-card-math .katex-display { margin: 0.3em 0; }
    .scene-card.is-updating .scene-card-content { animation: card-content-change 0.45s ease; }
    @keyframes card-content-change { from { opacity: 0.15; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .scene-label-text .katex { font-size: 1.05em; }

    #slider-panel {
      position: absolute;
      left: 14px;
      top: 14px;
      width: 230px;
      padding: 10px 12px 4px;
      background: rgba(23, 25, 24, 0.92);
      border: 1px solid rgba(51, 128, 255, 0.45);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      cursor: default;
      z-index: 3;
    }
    #slider-panel[hidden] { display: none; }
    .slider-hint { font-size: 10.5px; color: var(--text-tertiary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .slider-row { margin-bottom: 9px; }
    .slider-row-header { display: flex; justify-content: space-between; font-size: 12px; color: #eceeed; margin-bottom: 4px; }
    .slider-value { font-family: "SF Mono", Menlo, monospace; color: #7cc4ff; }
    .slider-row input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    #quiz-button.is-attention { box-shadow: 0 0 0 3px rgba(51, 128, 255, 0.35); }

    .scene-card.is-code .scene-card-body {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      color: #d7e3ff;
      white-space: pre;
      overflow-x: auto;
    }

    .concept-map-panel { background: #1a1c1b; width: min(760px, calc(100% - 32px)); height: calc(100% - 32px); max-height: none; display: flex; flex-direction: column; }
    .concept-map-panel[hidden] { display: none; }
    #concept-map-content { flex: 1; min-height: 0; position: relative; }
    #concept-map-content svg { width: 100%; height: 100%; display: block; }
    .concept-map-legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-tertiary); padding-top: 8px; }
    .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
    .legend-dot.is-topic { background: var(--accent); }
    .legend-dot.is-related { background: #6b736f; }
    .concept-node-topic { cursor: pointer; }
    .concept-node-topic:hover circle { stroke: #ffffff; stroke-width: 2; }

    .scene-card-body {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-secondary);
    }

    #loading-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    /* ---- Caption: the current step's narration ---- */
    #caption {
      min-height: 76px;
      padding: 14px 20px 6px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-primary);
      transition: opacity 0.3s ease;
    }

    #caption.is-changing { opacity: 0; }

    /* ---- Controls ---- */
    #controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px 14px;
    }

    .control-button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .control-button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .control-button.is-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .control-button.is-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }

    .control-button:disabled {
      opacity: 0.35;
      cursor: default;
      background: transparent;
    }

    #step-dots {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: none;
      padding: 0;
      background: var(--border);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .step-dot:hover { background: var(--text-tertiary); }
    .step-dot.is-done { background: rgba(51, 128, 255, 0.45); }
    .step-dot.is-current { background: var(--accent); transform: scale(1.35); }

    /* ── Glass layout ────────────────────────────────────────────────────
       The window is frosted glass (NSVisualEffectView) behind this page.
       The stage fills it; the title, controls, and subtitles float on top,
       and the chrome fades away while the explanation plays. */
    html, body { background: transparent; }
    #explainer { position: relative; display: block; height: 100%; }
    #stage {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 42%, rgba(51, 128, 255, 0.07), transparent 65%);
    }
    #drag-handle {
      position: absolute;
      top: 6px;
      left: 50%;
      width: 38px;
      height: 4px;
      margin-left: -19px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.18);
      z-index: 6;
      pointer-events: none;
    }
    #header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 18px 18px 18px;
      border-bottom: none;
      background: linear-gradient(to bottom, rgba(8, 10, 12, 0.5), transparent);
      transition: opacity 0.5s ease;
    }
    #scene-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    #step-counter { display: none; }
    .header-button { height: 24px; font-size: 11px; background: rgba(20, 22, 24, 0.45); }
    #caption {
      position: absolute;
      left: 50%;
      bottom: 54px;
      transform: translateX(-50%);
      z-index: 4;
      width: max-content;
      max-width: min(640px, calc(100% - 64px));
      min-height: 0;
      padding: 7px 14px;
      border-radius: 12px;
      background: rgba(8, 10, 12, 0.5);
      -webkit-backdrop-filter: blur(12px);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
    }
    #caption:empty { display: none; }
    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      padding: 10px 16px 14px;
      transition: opacity 0.5s ease;
    }
    .control-button { width: 28px; height: 28px; font-size: 11px; background: rgba(20, 22, 24, 0.5); -webkit-backdrop-filter: blur(10px); }
    .step-dot { transform: scale(0.75); }
    /* While playing and the mouse is still, only the explanation shows. */
    body.is-idle #header, body.is-idle #controls { opacity: 0; }
    /* The quiz is a small card in the corner, not a modal over the scene. */
    #quiz-panel {
      top: auto;
      left: auto;
      right: 16px;
      bottom: 54px;
      transform: none;
      width: min(340px, calc(100% - 32px));
      max-height: 62%;
      background: rgba(16, 18, 20, 0.86);
      -webkit-backdrop-filter: blur(18px);
    }
    #quiz-panel .stage-panel-title { font-size: 13px; }
    /* Cards ease in with a small spring instead of popping. */
    .scene-card { animation: scene-card-enter 0.55s cubic-bezier(0.2, 0.9, 0.25, 1.15); }
    @keyframes scene-card-enter {
      from { transform: translate(-50%, -50%) scale(0.93); }
      to { transform: translate(-50%, -50%) scale(1); }
    }
    #presenter-pointer {
      position: absolute;
      left: 0;
      top: 0;
      width: 22px;
      height: 22px;
      margin: -2px 0 0 -2px;
      fill: #3380ff;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 1.4;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(51, 128, 255, 0.85));
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 3;
    }
    #presenter-pointer.is-visible { opacity: 1; }
    /* Compact: a small diagram docked beside the user's app. */
    body.is-compact #header { padding: 14px 12px 10px; }
    body.is-compact #scene-title { font-size: 11.5px; }
    body.is-compact #concept-map-button, body.is-compact #library-button { display: none; }
    body.is-compact #caption { bottom: 46px; font-size: 12.5px; padding: 6px 11px; max-width: calc(100% - 32px); }
    body.is-compact #controls { padding: 8px 10px 10px; }
    body.is-compact .control-button { width: 24px; height: 24px; font-size: 10px; }
    body.is-compact .scene-label-text { font-size: 11px; }
  </style>
</head>
<body>
  <div id="explainer">
    <div id="drag-handle"></div>
    <div id="header">
      <div id="scene-title">heySona</div>
      <div id="step-counter"></div>
      <button class="header-button" id="quiz-button" title="Check your understanding" hidden>Quiz</button>
      <button class="header-button" id="concept-map-button" title="How everything you've learned connects">Map</button>
      <button class="header-button" id="library-button" title="Saved explanations">Library</button>
    </div>

    <div id="stage">
      <div id="label-layer"></div>
      <!-- Presenter pointer: glides to whatever the narration just mentioned. -->
      <svg id="presenter-pointer" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2 L20 11 L12 13 L9 21 Z"/></svg>
      <div id="loading-message">Preparing the explanation…</div>

      <!-- Live sliders: drag to change a value and watch the scene react. -->
      <div id="slider-panel" hidden></div>

      <!-- Quiz: a few multiple-choice questions after the explanation. -->
      <div class="stage-panel" id="quiz-panel" hidden>
        <div class="stage-panel-header">
          <div class="stage-panel-title">Check your understanding</div>
          <button class="panel-close-button" id="quiz-close-button" title="Close quiz">✕</button>
        </div>
        <div id="quiz-content"></div>
      </div>

      <!-- Concept map: every topic learned and how the ideas connect. -->
      <div class="stage-panel concept-map-panel" id="concept-map-panel" hidden>
        <div class="stage-panel-header">
          <div class="stage-panel-title">How your ideas connect</div>
          <button class="panel-close-button" id="concept-map-close-button" title="Close map">✕</button>
        </div>
        <div id="concept-map-content"></div>
        <div class="concept-map-legend">
          <span><i class="legend-dot is-topic"></i>Topics you've learned (click to replay)</span>
          <span><i class="legend-dot is-related"></i>Related ideas</span>
        </div>
      </div>

      <!-- Library: explanations saved on this Mac. -->
      <div class="stage-panel" id="library-panel" hidden>
        <div class="stage-panel-header">
          <div class="stage-panel-title">Saved explanations</div>
          <button class="panel-close-button" id="library-close-button" title="Close library">✕</button>
        </div>
        <div id="library-content"></div>
      </div>
    </div>

    <div id="caption"></div>

    <div id="controls">
      <button class="control-button" id="restart-button" title="Start over">↺</button>
      <button class="control-button" id="previous-button" title="Previous step">◀</button>
      <button class="control-button is-primary" id="play-pause-button" title="Play or pause">❚❚</button>
      <button class="control-button" id="next-button" title="Next step">▶</button>
      <div id="step-dots"></div>
      <button class="control-button" id="close-button" title="Close (Esc)">✕</button>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="katex/katex.min.js"></script>
  <script src="visual-explainer.js"></script>
</body>
</html>
